# main에 올라오면 검사하고 빌드해서 GitHub Pages(https://eastar-ds.github.io)에 배포합니다.
# 사용자 사이트(<계정>.github.io)라 astro.config.ts에 base가 없습니다.
# 저장소 설정 > Pages > Source를 「GitHub Actions」로 두어야 합니다.
# 배포가 끝나면 글이 바뀐 페이지 주소를 IndexNow로 검색 엔진에 알립니다(scripts/indexNow.ts). 알리기가 실패해도 배포는 성공으로 둡니다.
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것을 기다리게 합니다(진행 중인 배포는 끊지 않음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 검사와 빌드
    runs-on: ubuntu-latest
    outputs:
      indexnow-urls: ${{ steps.indexnow-plan.outputs.urls }}
    steps:
      - uses: actions/checkout@v7

      # pnpm 판은 package.json의 packageManager를 따릅니다
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm check

      - name: 단위 테스트
        run: pnpm test

      # astro build → 사이트 글자로 글꼴 만들기 → 다시 build → 빠진 글자 검사(빠지면 실패)
      - name: 빌드와 빠진 글자 검사
        run: pnpm build

      # 초안이 아닌 글을 docs/content-guide.md 10장 기준으로 검사하고(원문과 빌드 결과), 초안이 배포 빌드에 새지 않았는지 봅니다.
      # 실패가 하나라도 있으면 끝 코드 1로 배포를 멈춥니다. 경고는 로그에만 남습니다. 쓰는 법은 scripts/checkPost.ts의 머리 주석에 있습니다
      # 사실 대조는 저장소 밖 대조표를 CI가 읽을 수 없어 skip입니다. 게시 전에 prepublish-check가 로컬에서 확인합니다.
      - name: 게시 전 점검
        run: node scripts/checkPost.ts --all --dist dist

      - name: 커밋된 글꼴이 최신인지 알림
        run: |
          if ! git diff --quiet -- src/shared/styles/fonts; then
            echo "::warning::글꼴이 빌드에서 다시 만들어졌습니다. 배포에는 새 글꼴이 들어가지만, 로컬에서 pnpm build 후 src/shared/styles/fonts를 커밋해 두세요."
          fi

      # 지금 배포된 indexnow-pages.json(페이지마다 글의 해시)과 새 빌드를 견줘, 새로 생기거나 글이 바뀌거나 없어진 페이지를 고릅니다.
      # 새 목록은 dist에 넣어 함께 배포합니다. 고르기가 실패해도 배포는 이어 갑니다
      - name: IndexNow로 알릴 주소 고르기
        id: indexnow-plan
        continue-on-error: true
        run: node scripts/indexNow.ts plan

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: 바뀐 주소를 검색 엔진에 알리기 (IndexNow)
    needs: [build, deploy]
    if: needs.build.outputs.indexnow-urls != '' && needs.build.outputs.indexnow-urls != '[]'
    runs-on: ubuntu-latest
    # 검색 엔진이 받지 못해도 배포 결과는 성공으로 둡니다. 응답 코드는 이 작업의 로그에 남습니다
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # 스크립트가 바깥 패키지를 쓰지 않아 의존성 설치 없이 Node 24로 바로 돌립니다
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: IndexNow로 보내기
        run: node scripts/indexNow.ts submit
        env:
          INDEXNOW_URLS: ${{ needs.build.outputs.indexnow-urls }}
