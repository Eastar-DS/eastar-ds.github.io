# main에 올라오면 검사하고 빌드해서 GitHub Pages(https://eastar-ds.github.io)에 배포합니다.
# 사용자 사이트(<계정>.github.io)라 astro.config.ts에 base가 없습니다.
# 저장소 설정 > Pages > Source를 「GitHub Actions」로 두어야 합니다.
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것을 기다리게 합니다(진행 중인 배포는 끊지 않음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 검사와 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 판은 package.json의 packageManager를 따릅니다
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm check

      - name: 단위 테스트
        run: pnpm test

      # astro build → 사이트 글자로 글꼴 만들기 → 다시 build → 빠진 글자 검사(빠지면 실패)
      - name: 빌드와 빠진 글자 검사
        run: pnpm build

      - name: 커밋된 글꼴이 최신인지 알림
        run: |
          if ! git diff --quiet -- src/shared/styles/fonts; then
            echo "::warning::글꼴이 빌드에서 다시 만들어졌습니다. 배포에는 새 글꼴이 들어가지만, 로컬에서 pnpm build 후 src/shared/styles/fonts를 커밋해 두세요."
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
