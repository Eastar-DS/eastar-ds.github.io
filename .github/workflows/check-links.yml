# 주 1회 글(초안 포함)의 바깥 링크가 아직 열리는지 봅니다. 배포와 따로 돌아서 실패해도 배포에는 영향이 없습니다.
# 결과 표는 이 작업의 요약(Actions 실행 화면의 Summary)에 남습니다. 404 · 410 · 없는 도메인이 있으면 실패로 표시됩니다.
# 바깥 액션(lychee 등) 대신 scripts/checkLinks.ts를 씁니다. 게시 전 점검과 같은 MDX 읽기를 써서 코드 칸 속 예시 주소를 링크로 세지 않고,
# 바깥 패키지가 없어 의존성 설치 없이 Node 24로 바로 돕니다.
# 공개 저장소의 일정 작업은 저장소에 60일 동안 활동이 없으면 GitHub이 멈춥니다. 멈추면 Actions 화면에서 다시 켭니다.
name: 바깥 링크 검사

on:
  schedule:
    # 매주 월요일 09:00(한국 시간)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: 글의 바깥 링크 응답 보기
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 바깥 링크 검사
        run: node scripts/checkLinks.ts
